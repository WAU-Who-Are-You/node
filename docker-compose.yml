# Production-style WAU node behind Caddy (automatic HTTPS via Let's Encrypt).
#
#   NODE_DOMAIN=node.example.com NODE_REGISTRY_URL=https://registry.example.com \
#     docker compose up -d --build
#
# Needs: DNS for NODE_DOMAIN pointing at this host, ports 80/443 open.
# The node itself is NOT published — only Caddy is reachable — so it can trust
# the proxy's X-Forwarded-For (NODE_TRUST_PROXY=true) for per-IP limits.
# Back up the `node-data` volume: it holds the node's identity key.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  node:
    <<: *hardening
    user: bun   # unprivileged from the start; the entrypoint skips its root step
    build: .
    environment:
      NODE_PUBLIC_URL: https://${NODE_DOMAIN:?set NODE_DOMAIN}
      NODE_NAME: ${NODE_NAME:-}
      NODE_REGISTRY_URL: ${NODE_REGISTRY_URL:-}
      NODE_PEERS: ${NODE_PEERS:-}
      NODE_TRUST_PROXY: "true"
    volumes:
      - node-data:/data
    expose:
      - "3003"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_DOMAIN: ${NODE_DOMAIN}
    command: caddy reverse-proxy --from ${NODE_DOMAIN} --to node:3003
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      node:
        condition: service_healthy

volumes:
  node-data:
  caddy-data:
  caddy-config:
